[package]
name = "uptime-monitoring"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
url = "2.5"
rust-embed = { version = "8.13", features = ["mime-guess"] }
serde_json = "1"
http = "1"
argon2 = "0.6.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
subtle = "2.6.1"
form_urlencoded = "1.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-parser = "0.18.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 is unusably slow unoptimized; keeps debug builds and tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
