{# Pages of the logged-in admin. The template struct must provide `csrf_token`. #}
{% extends "base.html" %}

{% block body %}
<header>
    <div>
        <a href="/" class="header-logo" aria-label="Uptime Monitoring Home">
            <img alt="Uptime Monitoring logo" height="46" src="/static/images/icon.svg"/>
        </a>
        <nav aria-label="Main navigation">
            <a href="/">Monitors</a>
            <a href="/public-pages">Public pages</a>
            <a href="/alerts">Alerts</a>
        </nav>
    </div>
    <div>
        <a href="/settings" class="header-settings" aria-label="Settings">
            <img alt="" aria-hidden="true" height="32" src="/static/images/settings.svg"/>
        </a>
        <form action="/logout" method="POST" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="button-secondary" type="submit">Log out</button>
        </form>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>
{% endblock %}
