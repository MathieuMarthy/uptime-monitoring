<!DOCTYPE html>
<html lang="en">

    <meta name="color-scheme" content="light dark">
    <script src="/static/js/theme.js"></script>
    <link rel="icon" href="/static/images/favicon-32.png" sizes="32x32" type="image/png">

</head>
<body>

</html>
