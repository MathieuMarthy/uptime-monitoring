{# Pages shown without a session: setup, login, errors. #}
{% extends "base.html" %}

{% block body %}
<header>
    <div>
        <a href="/" class="header-logo" aria-label="Uptime Monitoring Home">
            <img alt="Uptime Monitoring logo" height="46" src="/static/images/icon.svg"/>
        </a>
    </div>
</header>

<main>
    <div class="error-banner insecure-warning" id="insecure-warning" role="alert" hidden>
        This page is served over plain HTTP: the browser will refuse the login cookie. Use HTTPS (through your reverse
        proxy) or open it on localhost.
    </div>
    {% block content %}{% endblock %}
</main>
<script src="/static/js/insecure-warning.js" defer></script>
{% endblock %}
