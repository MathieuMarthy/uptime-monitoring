# Example deployment. Put a reverse proxy (Caddy, Traefik, nginx) in front for HTTPS.
services:
  uptime-monitoring:
    image: ghcr.io/mathieumarthy/uptime-monitoring:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_URL: https://status.example.com
      # The proxy sets X-Forwarded-For: the login rate limit then sees the real client.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - data:/data
    # Least privilege. Root is only used at startup to hand /data to the app user (CHOWN), then
    # dropped for good (SETUID, SETGID). With `user: "65532:65532"` and a volume that user already
    # owns, `cap_add` can go too.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    # Only /data is written, backups included.
    read_only: true
    mem_limit: 128m
    pids_limit: 64

volumes:
  data:
